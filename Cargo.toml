[package]
name = "termyx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A fast, lightweight terminal with RTL support"
license = "MIT"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
alacritty_terminal = "0.26"
vte = "0.15"
portable-pty = "0.8"
unicode-width = "0.2"
unicode-bidi = "0.3"
fontdb = "0.23"
ttf-parser = "0.25"
ab_glyph = "0.2"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
arboard = "3"
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
