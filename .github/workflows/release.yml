name: release

# Pushing a v* tag builds the Windows binary, packs the terminal setup, and
# publishes both to a GitHub Release. Running the workflow by hand only
# produces downloadable artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check
        shell: pwsh
        run: |
          cargo fmt --check; if ($LASTEXITCODE) { exit 1 }
          cargo clippy --all-targets -- -D warnings; if ($LASTEXITCODE) { exit 1 }
          cargo test; if ($LASTEXITCODE) { exit 1 }

      - name: Build binary
        run: cargo build --release

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package setup package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP 'termyx-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'installer\setup.ps1', 'installer\setup.cmd', 'installer\path.ps1', $stage
          Copy-Item 'target\release\termyx.exe', 'README.md', $stage
          $powershell = Join-Path $stage 'powershell'
          New-Item -ItemType Directory -Path (Join-Path $powershell 'tools') -Force | Out-Null
          Copy-Item 'shell\powershell\Termyx' (Join-Path $powershell 'Termyx') -Recurse
          Copy-Item 'shell\powershell\tools\Install.ps1' (Join-Path $powershell 'tools')
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\Termyx-$version-setup.zip" -Force

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "target\release\termyx.exe", "README.md" `
            -DestinationPath "dist\Termyx-${{ steps.version.outputs.version }}-portable.zip" -Force

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\* | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: termyx-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Termyx ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
