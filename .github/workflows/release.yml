name: release

# Pushing a v* tag builds the Windows binary, compiles the Inno Setup
# installer, and publishes both to a GitHub Release. Running the workflow by
# hand only produces downloadable artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check
        shell: pwsh
        run: |
          cargo fmt --check; if ($LASTEXITCODE) { exit 1 }
          cargo clippy --all-targets -- -D warnings; if ($LASTEXITCODE) { exit 1 }
          cargo test; if ($LASTEXITCODE) { exit 1 }

      - name: Build binary
        run: cargo build --release

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "installer\Termyx.iss" "/DAppVersion=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "target\release\termyx.exe", "README.md" `
            -DestinationPath "dist\Termyx-${{ steps.version.outputs.version }}-portable.zip" -Force

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\* | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: termyx-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Termyx ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
